<div class="auction-detail-bids-list">
  {% for bid in bids %}
    <div class="auction-detail-bid-item">
      <div class="auction-detail-bidder-info">
        <div class="auction-detail-bidder-name">{{ bid.bidder }}</div>
        <div class="auction-detail-bid-time">{{ bid.timestamp|date:"M d, H:i" }}</div>
      </div>
      <div class="auction-detail-bid-amount">D{{ bid.amount }}</div>
    </div>
  {% empty %}
    <div class="auction-detail-no-bids">🎯 No bids yet. Be the first to bid!</div>
  {% endfor %}
</div>
