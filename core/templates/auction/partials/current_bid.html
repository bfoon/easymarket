<div class="auction-detail-current-bid-label">Current Highest Bid</div>
<div class="auction-detail-current-bid-amount">
  {% if bids %}
    D{{ bids.0.amount }}
  {% else %}
    D{{ auction.starting_bid|default:"0" }}
  {% endif %}
</div>
<div class="auction-detail-bid-count">
  {{ bids|length }} bid{{ bids|length|pluralize }}
</div>
