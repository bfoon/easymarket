<div class="auction-detail-questions-list">
  {% for question in public_questions %}
    <div class="auction-detail-question-item">
      <div class="auction-detail-question-author">{{ question.questioner }}</div>
      <div class="auction-detail-question-content">{{ question.content }}</div>
    </div>
  {% empty %}
    <div class="auction-detail-no-questions">💬 No questions yet. Ask the seller anything!</div>
  {% endfor %}
</div>
