{% extends "base.html" %}
{% load currency_tags %}

{% block content %}
<link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">
<div class="container py-5">
  <div class="card shadow-sm rounded-4">
    <div class="card-header bg-dark text-white rounded-top-4">
      <h5 class="mb-0">Pay for Order</h5>
    </div>
    <div class="card-body">
      <p class="mb-2"><strong>Order:</strong> {{ order.order_id }}</p>
      <p class="mb-2"><strong>Item:</strong> {{ order.listing.title }}</p>
      <p class="mb-4"><strong>Total:</strong> {% display_money order.total_amount %}</p>

      <form method="post">
        {% csrf_token %}
        <label class="form-label">Choose payment method</label>
        <select name="provider" class="form-select mb-3" required>
          {% for p in providers %}
            <option value="{{ p }}">{{ p|upper }}</option>
          {% endfor %}
        </select>

        <button class="btn btn-danger w-100">
          <i class="fas fa-lock me-2"></i>Pay Now
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
