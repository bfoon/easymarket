<div class="filter-section slide-in">
  <div class="d-flex align-items-center mb-4 flex-column flex-sm-row text-center text-sm-start">
    <div class="me-sm-3 mb-3 mb-sm-0">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; margin: 0 auto;">
        <i class="bi bi-funnel text-white"></i>
      </div>
    </div>
    <div>
      <h5 class="mb-1 fw-bold">Filter & Search</h5>
      <small class="text-muted">Find tickets quickly with smart filters</small>
    </div>
  </div>

  <form class="row g-3 g-md-4" method="get">
    <div class="col-12 col-md-6 col-lg-4">
      <label class="form-label">
        <i class="bi bi-search me-2 text-primary"></i>Search Tickets
      </label>
      <div class="position-relative">
        <input type="text" name="search" class="form-control ps-5" placeholder="Search by title, description..." value="{{ request.GET.search }}">
        <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
      </div>
    </div>

    <div class="col-6 col-md-6 col-lg-3">
      <label class="form-label">
        <i class="bi bi-kanban me-2 text-primary"></i>Status
      </label>
      <select name="status" class="form-select">
        <option value="">All Statuses</option>
        {% for key,label in ticket.STATUS_CHOICES %}
          <option value="{{ key }}" {% if request.GET.status == key %}selected{% endif %}>
            {{ label }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-6 col-md-6 col-lg-3">
      <label class="form-label">
        <i class="bi bi-flag me-2 text-primary"></i>Priority Level
      </label>
      <select name="priority" class="form-select">
        <option value="">All Priorities</option>
        {% for key,label in ticket.PRIORITY_CHOICES %}
          <option value="{{ key }}" {% if request.GET.priority == key %}selected{% endif %}>
            {{ label }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-12 col-lg-2 d-flex align-items-end">
      <button class="btn btn-primary w-100" type="submit">
        <i class="bi bi-funnel me-2"></i>Apply Filters
      </button>
    </div>
  </form>
</div>
