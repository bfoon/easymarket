<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#111;">
    <div style="max-width:640px;margin:0 auto;padding:24px;">
      <div style="background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.07);">
        <div style="padding:18px 20px;background:linear-gradient(90deg,#0d6efd,#20c997);color:#fff;">
          <div style="font-size:18px;font-weight:700;">EasyMarket • Social Cart</div>
          <div style="font-size:13px;opacity:.9;">Shop together, pay your share</div>
        </div>

        <div style="padding:22px 20px;">
          {% block content %}{% endblock %}
          <hr style="border:none;border-top:1px solid #e9eef6;margin:22px 0;">
          <div style="font-size:12px;color:#5c677a;line-height:1.45;">
            If you didn’t request this, you can ignore this email.<br>
            <strong>EasyMarket</strong> • Powered by EasySolutions
          </div>
        </div>
      </div>

      <div style="text-align:center;font-size:12px;color:#7b8798;margin-top:12px;">
        © {{ now|date:"Y" }} EasyMarket
      </div>
    </div>
  </body>
</html>
