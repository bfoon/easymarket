{% extends "emails/social_cart/base.html" %}
{% block content %}
  <h2 style="margin:0 0 10px;font-size:20px;">Invite accepted (Approval required)</h2>

  <p style="margin:0 0 14px;color:#2d3648;">
    <strong>{{ member_name }}</strong> accepted the invite and is waiting for approval.
  </p>

  <a href="{{ manage_link }}"
     style="display:inline-block;background:#20c997;color:#0b2e22;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:700;">
    Review & Approve
  </a>

  <p style="margin:14px 0 0;color:#5c677a;font-size:13px;">
    Manage Social Cart members from your cart page.
  </p>
{% endblock %}
