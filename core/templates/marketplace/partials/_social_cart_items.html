{% if social_items %}
<div class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th class="border-0 ps-4">Product</th>
        <th class="border-0 text-center d-none d-md-table-cell">Added By</th>
        <th class="border-0 text-center d-none d-md-table-cell">Price</th>
        <th class="border-0 text-center">Qty</th>
        <th class="border-0 text-center d-none d-lg-table-cell">Total</th>
        <th class="border-0 text-center">Actions</th>
      </tr>
    </thead>
    <tbody id="socialCartItems">
      {% for item in social_items %}
        {# 🔁 keep your existing row code exactly as-is #}
        {% include "marketplace/partials/_social_cart_row.html" %}
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="text-center py-5">
  <i class="fas fa-users fa-4x text-muted opacity-25 mb-3"></i>
  <h5 class="text-muted">Social cart is empty</h5>
</div>
{% endif %}
