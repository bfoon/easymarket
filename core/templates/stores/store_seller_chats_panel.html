{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">
<style>
/* ============================================================================
   SOCIAL CART CHAT PANEL - CREATIVE FLOATING UI
   ============================================================================ */

:root {
    --chat-primary: #2563eb;
    --chat-secondary: #3b82f6;
    --chat-success: #10b981;
    --chat-danger: #ef4444;
    --chat-warning: #f59e0b;
    --chat-dark: #1e293b;
    --chat-light: #f8fafc;
    --chat-border: #e2e8f0;
}

/* Main page layout */
.social-cart-chat-page {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 2rem 1rem;
}

.chat-header {
    text-align: center;
    color: white;
    margin-bottom: 2rem;
}

.chat-header h1 {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
}

.chat-header p {
    font-size: 1.1rem;
    opacity: 0.9;
}

/* Floating Chat Button - Bottom Right */
.floating-chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--chat-primary), var(--chat-secondary));
    color: white;
    border: none;
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    z-index: 9999;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.floating-chat-btn:hover {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 12px 32px rgba(37, 99, 235, 0.5);
}

.floating-chat-btn.has-unread {
    animation: pulse-glow 2s infinite;
}

@keyframes pulse-glow {
    0%, 100% {
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }
    50% {
        box-shadow: 0 8px 32px rgba(239, 68, 68, 0.6);
    }
}

.chat-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--chat-danger);
    color: white;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    border: 2px solid white;
    animation: bounce-in 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes bounce-in {
    0% { transform: scale(0); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* Floating Chatbox - Slides from right */
.floating-chatbox {
    position: fixed;
    bottom: 100px;
    right: 24px;
    width: 450px;
    height: 600px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    transform: translateX(500px);
    transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 9998;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.floating-chatbox.open {
    transform: translateX(0);
}

/* Chatbox Header */
.chatbox-header {
    background: linear-gradient(135deg, var(--chat-primary), var(--chat-secondary));
    color: white;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 16px 16px 0 0;
}

.chatbox-header h3 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
}

.chatbox-header .close-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}

.chatbox-header .close-btn:hover {
    background: rgba(255, 255, 255, 0.3);
}

/* Thread List Panel */
.thread-panel {
    width: 140px;
    background: var(--chat-light);
    border-right: 1px solid var(--chat-border);
    overflow-y: auto;
    flex-shrink: 0;
}

.thread-item {
    padding: 0.75rem 0.5rem;
    cursor: pointer;
    border-bottom: 1px solid var(--chat-border);
    transition: all 0.2s;
    position: relative;
}

.thread-item:hover {
    background: white;
}

.thread-item.active {
    background: white;
    border-left: 3px solid var(--chat-primary);
}

.thread-item .thread-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 0.9rem;
    margin: 0 auto 0.25rem;
}

.thread-item .thread-label {
    text-align: center;
    font-size: 0.7rem;
    color: var(--chat-dark);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.thread-item .unread-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--chat-danger);
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
}

/* Chat Content Area */
.chatbox-content {
    display: flex;
    flex: 1;
    overflow: hidden;
}

.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Messages Area */
.messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    background: #f9fafb;
}

.message {
    display: flex;
    margin-bottom: 1rem;
    animation: slide-in 0.3s ease-out;
}

@keyframes slide-in {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.from-store {
    justify-content: flex-end;
}

.message-bubble {
    max-width: 70%;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    position: relative;
}

.message.from-cart .message-bubble {
    background: white;
    border: 1px solid var(--chat-border);
    border-bottom-left-radius: 0.25rem;
}

.message.from-store .message-bubble {
    background: linear-gradient(135deg, var(--chat-primary), var(--chat-secondary));
    color: white;
    border-bottom-right-radius: 0.25rem;
}

.message-sender {
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    opacity: 0.8;
}

.message-text {
    word-wrap: break-word;
    line-height: 1.4;
}

.message-time {
    font-size: 0.7rem;
    opacity: 0.6;
    margin-top: 0.25rem;
}

/* Input Area */
.chat-input-area {
    padding: 1rem;
    background: white;
    border-top: 1px solid var(--chat-border);
}

.chat-input-form {
    display: flex;
    gap: 0.5rem;
}

.chat-input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--chat-border);
    border-radius: 24px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
}

.chat-input:focus {
    border-color: var(--chat-primary);
}

.send-btn {
    background: linear-gradient(135deg, var(--chat-primary), var(--chat-secondary));
    color: white;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.send-btn:hover {
    transform: scale(1.1);
}

.send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Empty State */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #94a3b8;
    text-align: center;
    padding: 2rem;
}

.empty-state i {
    font-size: 4rem;
    margin-bottom: 1rem;
    opacity: 0.3;
}

.empty-state p {
    font-size: 1rem;
    margin: 0;
}

/* Loading State */
.loading-spinner {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.spinner {
    border: 3px solid var(--chat-border);
    border-top: 3px solid var(--chat-primary);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 768px) {
    .floating-chatbox {
        width: 100%;
        height: 100%;
        right: 0;
        bottom: 0;
        border-radius: 0;
    }
    
    .floating-chatbox.open {
        transform: translateX(0);
    }
    
    .thread-panel {
        width: 100px;
    }
}

/* Notification Toast */
.notification-toast {
    position: fixed;
    top: 24px;
    right: 24px;
    background: white;
    padding: 1rem 1.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 1rem;
    transform: translateX(400px);
    transition: transform 0.3s ease-out;
    z-index: 10000;
}

.notification-toast.show {
    transform: translateX(0);
}

.notification-toast .toast-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--chat-primary), var(--chat-secondary));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.notification-toast .toast-content h4 {
    margin: 0 0 0.25rem;
    font-size: 0.95rem;
    font-weight: 600;
}

.notification-toast .toast-content p {
    margin: 0;
    font-size: 0.85rem;
    color: #64748b;
}
</style>

<div class="social-cart-chat-page">
    <div class="chat-header">
        <h1><i class="fas fa-comments"></i> Social Cart Chats</h1>
        <p>Manage conversations with social shopping groups</p>
    </div>
</div>

<!-- Floating Chat Button -->
<button class="floating-chat-btn" id="chatToggleBtn" onclick="toggleChatbox()">
    <i class="fas fa-comments"></i>
    <span class="chat-badge" id="chatBadge" style="display: none;">0</span>
</button>

<!-- Floating Chatbox -->
<div class="floating-chatbox" id="floatingChatbox">
    <!-- Header -->
    <div class="chatbox-header">
        <h3><i class="fas fa-users"></i> Social Cart Chats</h3>
        <button class="close-btn" onclick="toggleChatbox()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <!-- Content -->
    <div class="chatbox-content">
        <!-- Thread List Panel -->
        <div class="thread-panel" id="threadPanel">
            <!-- Threads will be loaded here -->
        </div>
        
        <!-- Main Chat Area -->
        <div class="chat-main">
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>Select a conversation to start chatting</p>
                </div>
            </div>
            
            <div class="chat-input-area" id="chatInputArea" style="display: none;">
                <form class="chat-input-form" onsubmit="sendMessage(event)">
                    <input 
                        type="text" 
                        class="chat-input" 
                        id="messageInput" 
                        placeholder="Type your message..."
                        autocomplete="off"
                    >
                    <button type="submit" class="send-btn" id="sendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Notification Toast -->
<div class="notification-toast" id="notificationToast">
    <div class="toast-icon">
        <i class="fas fa-bell"></i>
    </div>
    <div class="toast-content">
        <h4 id="toastTitle">New Message</h4>
        <p id="toastMessage">You have a new message</p>
    </div>
</div>

<script>
// ============================================================================
// SOCIAL CART SELLER CHATS - FIXED VERSION
// ============================================================================

const STORE_ID = "{{ store.id }}";
let currentConversation = null;
let conversations = [];
let pollInterval = null;

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    console.log('Initializing chat panel for store:', STORE_ID);
    loadConversations();
    startPolling();
});

// Toggle chatbox visibility
function toggleChatbox() {
    const chatbox = document.getElementById('floatingChatbox');
    chatbox.classList.toggle('open');

    if (chatbox.classList.contains('open')) {
        loadConversations();
    }
}

// Load all conversations
async function loadConversations() {
    try {
        const url = `/stores/api/store/${STORE_ID}/seller-chats/`;
        console.log('Loading conversations from:', url);

        const response = await fetch(url);
        const data = await response.json();

        console.log('Conversations loaded:', data);

        if (data.success) {
            conversations = data.threads || [];
            renderConversations();
            updateUnreadBadge();
        }
    } catch (error) {
        console.error('Error loading conversations:', error);
    }
}

// Render conversation list
function renderConversations() {
    const panel = document.getElementById('threadPanel');

    if (!conversations || conversations.length === 0) {
        panel.innerHTML = `
            <div style="padding: 2rem 1rem; text-align: center; color: #94a3b8;">
                <i class="fas fa-inbox" style="font-size: 2rem; opacity: 0.3; display: block; margin-bottom: 0.5rem;"></i>
                <p style="font-size: 0.8rem; margin: 0;">No questions yet</p>
            </div>
        `;
        return;
    }

    const threadItems = conversations.map((conv, index) => {
        // Ensure we have valid data
        if (!conv.product || !conv.full_cart_id) {
            console.warn('Invalid conversation data:', conv);
            return '';
        }

        // Create conversation data object
        const convData = {
            id: conv.id || `conv_${index}`,
            social_cart_id: conv.full_cart_id,  // ✅ Use full UUID
            product_id: String(conv.product_id || conv.product.id)  // Ensure it's a string
        };

        console.log('Thread data:', convData);

        // Safely get product name
        const productName = conv.product.name || 'Unknown Product';
        const productInitials = productName.substring(0, 2).toUpperCase();
        const productLabel = productName.length > 12
            ? productName.substring(0, 12) + '...'
            : productName;

        // Create the HTML (note: no extra closing parenthesis!)
        return `
            <div class="thread-item ${currentConversation && currentConversation.id === conv.id ? 'active' : ''}"
                 data-conv-id="${convData.id}"
                 onclick="selectConversationByData('${escapeForAttr(convData.social_cart_id)}', '${escapeForAttr(convData.product_id)}', '${escapeForAttr(convData.id)}')">
                <div class="thread-avatar">
                    ${productInitials}
                </div>
                <div class="thread-label" title="${escapeForAttr(productName)}">
                    ${productLabel}
                </div>
                ${(conv.unread_count || 0) > 0 ? `
                    <span class="unread-badge">${conv.unread_count}</span>
                ` : ''}
            </div>
        `;
    }).filter(html => html !== '').join('');

    panel.innerHTML = threadItems;
}

// Helper function to select conversation by data attributes
function selectConversationByData(socialCartId, productId, convId) {
    const conversation = {
        id: convId,
        social_cart_id: socialCartId,
        product_id: productId
    };
    selectConversation(conversation);
}

// Select a conversation
async function selectConversation(conversation) {
    console.log('=== SELECT CONVERSATION ===');
    console.log('Conversation:', conversation);
    console.log('Cart ID:', conversation.social_cart_id);
    console.log('Product ID:', conversation.product_id);

    // Validate IDs
    if (!conversation.social_cart_id || !conversation.product_id) {
        console.error('Invalid conversation data:', conversation);
        alert('Error: Invalid conversation data. Please refresh the page.');
        return;
    }

    // Check if social_cart_id looks like a UUID
    if (conversation.social_cart_id.length < 30) {
        console.error('social_cart_id too short - probably not a UUID:', conversation.social_cart_id);
        alert('Error: Invalid cart ID format. Please refresh the page.');
        return;
    }

    currentConversation = conversation;
    renderConversations();
    loadMessages(conversation.social_cart_id, conversation.product_id);

    // Show input area
    document.getElementById('chatInputArea').style.display = 'block';
}

// Load messages for a conversation
async function loadMessages(socialCartId, productId) {
    const container = document.getElementById('messagesContainer');

    console.log('=== LOAD MESSAGES ===');
    console.log('Cart ID:', socialCartId);
    console.log('Product ID:', productId);

    if (!socialCartId || !productId) {
        console.error('Missing parameters');
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle"></i>
                <p>Error: Missing conversation data</p>
            </div>
        `;
        return;
    }

    // Show loading
    container.innerHTML = `
        <div class="loading-spinner">
            <div class="spinner"></div>
        </div>
    `;

    try {
        const url = `/stores/api/store/seller-chat/${socialCartId}/${productId}/messages/`;
        console.log('Fetching messages from:', url);

        const response = await fetch(url);

        console.log('Response status:', response.status);

        if (!response.ok) {
            const errorText = await response.text();
            console.error('Response error:', errorText);
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        console.log('Messages data:', data);

        if (data.success) {
            renderMessages(data.messages, data.conversation);
            // Reload conversations to update unread count
            loadConversations();
        } else {
            throw new Error(data.message || 'Failed to load messages');
        }
    } catch (error) {
        console.error('Error loading messages:', error);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle"></i>
                <p>Error loading messages</p>
                <p style="font-size: 0.9rem; color: #ef4444; margin-top: 0.5rem;">${error.message}</p>
                <button onclick="loadMessages('${escapeForAttr(socialCartId)}', '${escapeForAttr(productId)}')"
                        style="margin-top: 1rem; padding: 0.5rem 1rem; background: var(--chat-primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                    Retry
                </button>
            </div>
        `;
    }
}

// Render messages
function renderMessages(messages, conversation) {
    const container = document.getElementById('messagesContainer');

    if (!messages || messages.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-comment-slash"></i>
                <p>No messages yet. Waiting for questions...</p>
            </div>
        `;
        return;
    }

    // Add conversation header
    let html = `
        <div style="background: #f8fafc; padding: 1rem; margin-bottom: 1rem; border-radius: 12px; border: 1px solid #e2e8f0;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                ${conversation.product && conversation.product.image ? `
                    <img src="${conversation.product.image}"
                         alt="${escapeHtml(conversation.product.name)}"
                         style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover;">
                ` : ''}
                <div style="flex: 1;">
                    <div style="font-weight: 600; margin-bottom: 0.25rem;">
                        ${conversation.product ? escapeHtml(conversation.product.name) : 'Product'}
                    </div>
                    <div style="font-size: 0.9rem; color: #64748b;">
                        Cart: ${conversation.social_cart_id || 'N/A'} • ${(conversation.members || []).length} member(s)
                    </div>
                </div>
            </div>
        </div>
    `;

    // Add messages
    html += messages.map(msg => `
        <div class="message ${msg.is_from_store ? 'from-store' : 'from-cart'}">
            <div class="message-bubble">
                <div class="message-sender">${escapeHtml(msg.sender.name)}</div>
                <div class="message-text">${escapeHtml(msg.content)}</div>
                <div class="message-time">${formatTime(msg.created_at)}</div>
            </div>
        </div>
    `).join('');

    container.innerHTML = html;

    // Scroll to bottom
    setTimeout(() => {
        container.scrollTop = container.scrollHeight;
    }, 100);
}

// Send message
async function sendMessage(event) {
    event.preventDefault();

    const input = document.getElementById('messageInput');
    const message = input.value.trim();

    if (!message || !currentConversation) return;

    const sendBtn = document.getElementById('sendBtn');
    const originalText = sendBtn.innerHTML;
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    try {
        const response = await fetch('/stores/api/store/seller-chat/reply/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                social_cart_id: currentConversation.social_cart_id,
                product_id: currentConversation.product_id,
                message: message
            })
        });

        const data = await response.json();

        if (data.success) {
            input.value = '';
            loadMessages(currentConversation.social_cart_id, currentConversation.product_id);
        } else {
            alert('Error sending message: ' + data.message);
        }
    } catch (error) {
        console.error('Error sending message:', error);
        alert('Error sending message. Please try again.');
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = originalText;
        input.focus();
    }
}

// Update unread badge
function updateUnreadBadge() {
    const totalUnread = conversations.reduce((sum, c) => sum + (c.unread_count || 0), 0);
    const badge = document.getElementById('chatBadge');
    const btn = document.getElementById('chatToggleBtn');

    if (totalUnread > 0) {
        badge.textContent = totalUnread > 99 ? '99+' : totalUnread;
        badge.style.display = 'flex';
        btn.classList.add('has-unread');
    } else {
        badge.style.display = 'none';
        btn.classList.remove('has-unread');
    }
}

// Show notification toast
function showNotification(title, message) {
    const toast = document.getElementById('notificationToast');
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMessage').textContent = message;

    toast.classList.add('show');

    setTimeout(() => {
        toast.classList.remove('show');
    }, 5000);
}

// Start polling for new messages
function startPolling() {
    pollInterval = setInterval(() => {
        loadConversations();

        if (currentConversation) {
            loadMessages(currentConversation.social_cart_id, currentConversation.product_id);
        }
    }, 5000); // Poll every 5 seconds
}

// Utility functions
function formatTime(isoString) {
    try {
        const date = new Date(isoString);
        const now = new Date();
        const diff = now - date;
        const minutes = Math.floor(diff / 60000);

        if (minutes < 1) return 'Just now';
        if (minutes < 60) return `${minutes}m ago`;
        if (minutes < 1440) return `${Math.floor(minutes / 60)}h ago`;
        return date.toLocaleDateString();
    } catch (e) {
        return 'Recently';
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function escapeForAttr(text) {
    if (!text) return '';
    return String(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
    if (pollInterval) {
        clearInterval(pollInterval);
    }
});
</script>
