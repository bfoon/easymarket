{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>403 · Access Denied</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Optional Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      min-height:100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color:#e5e7eb;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell;
    }
    .card-403{
      max-width:520px;
      background:#020617;
      border-radius:18px;
      padding:2.5rem;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      border:1px solid #1f2937;
    }
    .badge-403{
      display:inline-block;
      padding:.35rem .75rem;
      border-radius:999px;
      background:rgba(239,68,68,.15);
      color:#fecaca;
      font-weight:800;
      letter-spacing:.3px;
      margin-bottom:1rem;
    }
    h1{
      font-size:2.2rem;
      font-weight:900;
      margin-bottom:.75rem;
    }
    p{
      color:#9ca3af;
      margin-bottom:1.5rem;
      line-height:1.6;
    }
    .btn-main{
      border-radius:12px;
      padding:.65rem 1.2rem;
      font-weight:800;
    }
  </style>
</head>
<body>

  <div class="card-403 text-center">
    <div class="badge-403">403 · ACCESS DENIED</div>

    <h1>Permission Required</h1>

    <p>
      You don’t have permission to access this page or order.
      This usually happens when:
      <br>• You’re not the buyer or store owner  
      <br>• The order belongs to another account  
      <br>• Your session expired
    </p>

    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <button onclick="history.back()" class="btn btn-outline-light btn-main">
        ← Go Back
      </button>

      <a href="/" class="btn btn-primary btn-main">
        Go to Dashboard
      </a>
    </div>
  </div>

</body>
</html>
