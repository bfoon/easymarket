{# Shared dispatch CSS — {% include %} this inside {% block extra_css %} blocks #}
<style>
/* ── Page Header ─────────────────────────────────────────────────────────── */
.dispatch-page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.75rem;
  flex-wrap: wrap;
  gap: 1rem;
}
.dispatch-page-header h1 {
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--text-primary);
  margin: 0 0 0.25rem;
}
.dispatch-page-header p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  margin: 0;
}

/* ── Status badges ───────────────────────────────────────────────────────── */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.3rem 0.75rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  white-space: nowrap;
}
/* driver statuses */
.status-active      { background: #dcfce7; color: #166534; }
.status-available   { background: #dcfce7; color: #166534; }
.status-pending_vetting { background: #fef9c3; color: #854d0e; }
.status-pending     { background: #fef9c3; color: #854d0e; }
.status-suspended   { background: #fee2e2; color: #991b1b; }
.status-rejected    { background: #f1f5f9; color: #475569; }
.status-on_trip     { background: #dbeafe; color: #1e40af; }
.status-in_progress { background: #dbeafe; color: #1e40af; }
.status-offline     { background: #f1f5f9; color: #64748b; }
/* task statuses */
.status-assigned    { background: #e0f2fe; color: #0369a1; }
.status-completed   { background: #dcfce7; color: #166534; }
.status-cancelled   { background: #fee2e2; color: #991b1b; }
/* drone statuses */
.status-on_mission  { background: #dbeafe; color: #1e40af; }
.status-charging    { background: #fef9c3; color: #854d0e; }
.status-maintenance { background: #fce7f3; color: #9d174d; }

/* ── Metric cards (dashboard) ────────────────────────────────────────────── */
.metric-card {
  background: white;
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}
.metric-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.metric-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}
.metric-card.primary::before { background: var(--primary-gradient); }
.metric-card.success::before { background: var(--success-gradient); }
.metric-card.warning::before { background: var(--warning-gradient); }
.metric-card.info::before    { background: var(--info-gradient); }
.metric-card.danger::before  { background: linear-gradient(135deg, #ef4444, #dc2626); }

.metric-icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem;
  margin-bottom: 1rem;
}
.metric-icon.primary { background: rgba(102,126,234,.12); color: #667eea; }
.metric-icon.success { background: rgba(16,185,129,.12);  color: #10b981; }
.metric-icon.warning { background: rgba(245,158,11,.12);  color: #f59e0b; }
.metric-icon.info    { background: rgba(59,130,246,.12);  color: #3b82f6; }
.metric-icon.danger  { background: rgba(239,68,68,.12);   color: #ef4444; }
.metric-card .metric-value { font-size: 2.25rem; font-weight: 800; color: var(--text-primary); line-height: 1; margin-bottom: 0.35rem; }
.metric-card .metric-label { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

/* ── Driver avatar ───────────────────────────────────────────────────────── */
.driver-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--primary-gradient);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem;
  flex-shrink: 0;
  overflow: hidden;
}
.driver-avatar img { width: 100%; height: 100%; object-fit: cover; }
.driver-avatar-lg {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--primary-gradient);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.5rem;
  overflow: hidden;
}
.driver-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }

/* ── Table ───────────────────────────────────────────────────────────────── */
.dispatch-table { border-radius: 12px; overflow: hidden; }
.dispatch-table thead th {
  background: var(--bg-secondary);
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  border: none;
  padding: 0.875rem 1rem;
}
.dispatch-table tbody tr {
  border-bottom: 1px solid var(--border-color);
  transition: background 0.15s;
}
.dispatch-table tbody tr:hover { background: var(--bg-secondary); }
.dispatch-table tbody tr:last-child { border-bottom: none; }
.dispatch-table tbody td { padding: 0.875rem 1rem; vertical-align: middle; border: none; }

/* ── Task card (used in lists) ───────────────────────────────────────────── */
.task-row {
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  background: white;
  transition: all 0.2s ease;
  margin-bottom: 0.75rem;
}
.task-row:hover { border-color: var(--primary-color); box-shadow: var(--shadow-sm); }
.task-row:last-child { margin-bottom: 0; }

/* ── Form styles ─────────────────────────────────────────────────────────── */
.dispatch-form .form-label { font-weight: 600; color: var(--text-primary); font-size: 0.9rem; margin-bottom: 0.4rem; }
.dispatch-form .form-control,
.dispatch-form .form-select {
  border-radius: 10px;
  border: 2px solid var(--border-color);
  padding: 0.625rem 1rem;
  transition: all 0.2s;
  font-size: 0.95rem;
}
.dispatch-form .form-control:focus,
.dispatch-form .form-select:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
}
.dispatch-form .form-section { margin-bottom: 2rem; }
.dispatch-form .form-section-title {
  font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-tertiary);
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.5rem; margin-bottom: 1.25rem;
}
.dispatch-form .invalid-feedback { font-size: 0.82rem; color: var(--danger-color); margin-top: 0.25rem; display: block; }
.dispatch-form .form-control.is-invalid { border-color: var(--danger-color); }

/* ── Empty state ─────────────────────────────────────────────────────────── */
.empty-state { text-align: center; padding: 4rem 2rem; }
.empty-state i { font-size: 3.5rem; color: #cbd5e1; margin-bottom: 1.25rem; display: block; }
.empty-state h5 { color: var(--text-secondary); font-weight: 600; margin-bottom: 0.5rem; }
.empty-state p  { color: var(--text-tertiary); font-size: 0.9rem; }

/* ── Timeline (detail pages) ─────────────────────────────────────────────── */
.timeline { position: relative; padding-left: 1.5rem; }
.timeline::before { content: ''; position: absolute; left: 0.45rem; top: 0; bottom: 0; width: 2px; background: var(--border-color); }
.timeline-item { position: relative; padding-bottom: 1.25rem; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-dot {
  position: absolute; left: -1.5rem;
  width: 14px; height: 14px;
  border-radius: 50%; border: 2px solid white;
  top: 3px;
}
.timeline-dot.success { background: var(--success-color); }
.timeline-dot.primary { background: var(--primary-color); }
.timeline-dot.warning { background: var(--warning-color); }
.timeline-dot.danger  { background: var(--danger-color);  }
.timeline-dot.secondary { background: #94a3b8; }
.timeline-time { font-size: 0.78rem; color: var(--text-tertiary); margin-bottom: 0.2rem; }
.timeline-text { font-size: 0.9rem; color: var(--text-primary); }

/* ── Battery indicator ───────────────────────────────────────────────────── */
.battery-bar { height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
.battery-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
.battery-fill.high   { background: #10b981; }
.battery-fill.medium { background: #f59e0b; }
.battery-fill.low    { background: #ef4444; }

/* ── Pagination ──────────────────────────────────────────────────────────── */
.pagination .page-link { border-radius: 8px; margin: 0 2px; border: 1px solid var(--border-color); color: var(--text-secondary); }
.pagination .page-link:hover { background: var(--bg-secondary); }
.pagination .page-item.active .page-link { background: var(--primary-gradient); border-color: transparent; }
</style>
